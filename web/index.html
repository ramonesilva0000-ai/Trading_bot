<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bot" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <title>Trading Bot</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" id="connDot" aria-hidden="true"></span>
      <span>Trading Bot</span>
    </div>
    <div class="status-pill" id="statusPill">offline</div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" role="tablist">
    <button class="tab active" data-tab="dashboard" role="tab">Dashboard</button>
    <button class="tab" data-tab="traders" role="tab">Traders</button>
    <button class="tab" data-tab="events" role="tab">Events</button>
    <button class="tab" data-tab="settings" role="tab">Settings</button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
